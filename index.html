<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="My Budget"><link rel="icon" type="image/png" sizes="192x192" href="/Monthly-Budget/icons/icon-192.png"><link rel="apple-touch-icon" sizes="192x192" href="/Monthly-Budget/icons/icon-192.png"><link rel="manifest" href="/Monthly-Budget/manifest.json"><title>My Budget V3</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#111827;font-family:system-ui,Arial}main{max-width:760px;margin:auto;padding:14px 14px 90px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.title{font-size:25px;font-weight:850}.muted{font-size:12px;color:#64748b}.month,input,select,button{min-height:44px;border:1px solid #e2e8f0;border-radius:12px;padding:9px 11px;font:inherit;background:white}.month{width:155px}.status{padding:18px;border-radius:20px;margin:12px 0}.green{background:#dcfce7;color:#16a34a}.orange{background:#fef3c7;color:#d97706}.red{background:#fee2e2;color:#dc2626}.big{font-size:30px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card,.panel{background:white;border:1px solid #e2e8f0;border-radius:17px;padding:14px;margin-top:12px}.val{font-size:20px;font-weight:850}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.amount{font-size:24px;font-weight:850}.money{padding-left:25px}.field{margin:9px 0}label{display:block;font-size:11px;color:#64748b;font-weight:750;margin-bottom:4px}button{width:100%;background:#2563eb;color:white;border:0;font-weight:800}.secondary{background:#eff6ff;color:#1d4ed8}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.quick button{background:white;color:#111827;border:1px solid #e2e8f0}.quick span{display:block;font-size:20px}.cat{padding:10px 0;border-bottom:1px solid #eef2f7}.ch{display:grid;grid-template-columns:1fr 65px 65px 65px;gap:5px;align-items:center;font-size:11px}.name{font-weight:800}.bar{height:7px;background:#e5e7eb;border-radius:8px;margin-top:6px;overflow:hidden}.fill{height:100%;background:#16a34a}.fill.orange{background:#d97706}.fill.red{background:#dc2626}.pill{text-align:center;border-radius:99px;padding:5px 2px;font-size:9px;font-weight:850}.pill.green{background:#dcfce7}.pill.orange{background:#fef3c7}.pill.red{background:#fee2e2}.expense{display:flex;justify-content:space-between;border:1px solid #e2e8f0;border-radius:11px;padding:10px;margin:7px 0}.expense small{display:block;color:#64748b}.budget{display:grid;grid-template-columns:1fr 120px;gap:8px;margin:7px 0}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);background:white;border-top:1px solid #e2e8f0;display:grid;grid-template-columns:repeat(4,1fr);padding:6px}.bottom button{background:white;color:#64748b;font-size:10px}.bottom span{display:block;font-size:19px}@media(max-width:430px){.top{flex-direction:column;align-items:stretch}.month{width:100%}.row{grid-template-columns:1fr}.ch{grid-template-columns:1fr 55px 55px 60px}}
</style></head><body><main>
<div class="top"><div><div class="title">💰 My Budget</div><div class="muted">V3.3 • Mobile Finance App</div></div><input id="month" class="month" type="month"></div>
<div id="status" class="status green"><b id="st">🟢 WITHIN BUDGET</b><div id="rem" class="big">₹0 remaining</div><div id="ss" class="muted">Loading…</div></div>
<div class="stats"><div class="card"><div class="muted">Income</div><div id="iv" class="val">₹0</div></div><div class="card"><div class="muted">Budget</div><div id="bv" class="val">₹0</div></div><div class="card"><div class="muted">Spent</div><div id="pv" class="val">₹0</div></div><div class="card"><div class="muted">Balance</div><div id="bal" class="val">₹0</div></div></div>
<div id="installBox" style="display:none;margin:12px 0"><button id="installBtn" type="button">📲 INSTALL MY BUDGET APP</button><div id="installMsg" class="muted" style="margin-top:5px"></div></div><div id="pwaDiag" class="panel" style="margin:12px 0"><h3>📱 PWA Status</h3><div id="pwaDiagText" class="muted">Checking installation support…</div></div><div class="quick"><button data-c="Groceries">🛒<span>Groceries</span></button><button data-c="Fuel/Transport">⛽<span>Fuel</span></button><button data-c="Household">🏠<span>Home</span></button></div>
<section id="expense" class="panel"><h3>➕ Add Expense</h3><form id="form"><div class="field"><label>Amount</label><input id="amount" class="amount" type="number" min="1" required placeholder="0"></div><div class="row"><div><label>Category</label><select id="category"></select></div><div><label>Mode</label><select id="mode"><option>UPI</option><option>Cash</option><option>Credit Card</option><option>Debit Card</option><option>Bank Transfer</option><option>Other</option></select></div></div><div class="row"><div><label>Date</label><input id="date" type="date" required></div><div><label>Description</label><input id="desc" maxlength="120" placeholder="Optional"></div></div><button>SAVE EXPENSE</button><div id="em" class="muted"></div></form></section>
<section id="dashboard" class="panel"><h3>📊 Spending Overview</h3><div id="chart" class="muted">Loading…</div></section>
<section id="budget" class="panel"><h3>🚦 Category Status <span id="sync" class="muted"></span></h3><div id="cats"></div></section>
<section class="panel"><h3>⚙️ Monthly Budget</h3><div class="row"><div><label>Income</label><input id="income" type="number"></div><div><label>Overall Budget</label><input id="overall" type="number"></div></div><div id="bis"></div><button id="saveB" class="secondary">SAVE BUDGET</button><div id="bm" class="muted"></div></section>
<section id="history" class="panel"><h3>🧾 Recent Expenses</h3><div id="expenses"></div></section>
<section class="panel"><h3>💳 By Payment Mode</h3><div id="modes"></div></section>
</main><nav class="bottom"><button data-go="dashboard">🏠<span>Home</span></button><button data-go="expense">➕<span>Expense</span></button><button data-go="budget">🚦<span>Budget</span></button><button data-go="history">🧾<span>History</span></button></nav>
<script src="config.js"></script><script>
(()=>{const C=window.BUDGET_CONFIG||{},cats=C.categories||["Loans/EMI","Credit Card","Electricity & Water","Mobile/Internet","Groceries","School Fees","Fuel/Transport","Insurance","Medical/Health","Household","Shopping","Subscriptions","Savings/Investments","Miscellaneous"],$=x=>document.getElementById(x),M=n=>"₹"+Math.round(+n||0).toLocaleString("en-IN"),d=new Date(),today=d.toISOString().slice(0,10);let s=JSON.parse(localStorage.getItem("mbv3")||"null")||{income:0,overall:0,budgets:{},expenses:[]};cats.forEach(c=>s.budgets[c]??=0);$("month").value=today.slice(0,7);$("date").value=today;cats.forEach(c=>{$("category").insertAdjacentHTML("beforeend",`<option>${c}</option>`);$("bis").insertAdjacentHTML("beforeend",`<div class="budget"><label>${c}</label><input class="bi" data-c="${c}" type="number" min="0" placeholder="Budget"></div>`)});function save(){localStorage.setItem("mbv3",JSON.stringify(s))}function fill(){$("income").value=s.income||"";$("overall").value=s.overall||"";document.querySelectorAll(".bi").forEach(x=>x.value=s.budgets[x.dataset.c]||"")}function ex(){return s.expenses.filter(x=>(x.date||"").slice(0,7)==$("month").value)}function render(){let a=ex(),spent=a.reduce((x,e)=>x+e.amount,0),budget=s.overall||Object.values(s.budgets).reduce((x,n)=>x+(+n||0),0),r=budget?spent/budget:0,k=r>1?"red":r>=.8?"orange":"green",left=budget-spent;$("status").className="status "+k;$("st").textContent=k=="red"?"🔴 BUDGET EXCEEDED":k=="orange"?"🟠 NEAR BUDGET LIMIT":"🟢 WITHIN BUDGET";$("rem").textContent=left>=0?M(left)+" remaining":M(-left)+" over budget";$("ss").textContent=budget?Math.round(r*100)+"% of budget used":"Set budget below";$("iv").textContent=M(s.income);$("bv").textContent=M(budget);$("pv").textContent=M(spent);$("bal").textContent=M((+s.income||0)-spent);$("cats").innerHTML=cats.map(c=>{let b=+s.budgets[c]||0,v=a.filter(e=>e.category==c).reduce((x,e)=>x+e.amount,0),q=b?v/b:0,z=q>1?"red":q>=.8?"orange":"green";return `<div class="cat"><div class="ch"><div><div class="name">${c}</div><div class="bar"><div class="fill ${z}" style="width:${Math.min(q*100,100)}%"></div></div></div><div>${M(b)}</div><div>${M(v)}</div><div class="pill ${z}">${b?(q>1?"RED":q>=.8?"WARN":"OK"):"—"}</div></div></div>`}).join("");$("expenses").innerHTML=a.length?a.slice().sort((x,y)=>y.ts-x.ts).slice(0,40).map(e=>`<div class="expense"><div><b>${e.category}</b><small>${e.date} • ${e.mode}${e.description?" • "+e.description:""}</small></div><b>${M(e.amount)}</b></div>`).join(""):"<div class='muted'>No expenses this month.</div>";let modes={};a.forEach(e=>modes[e.mode]=(modes[e.mode]||0)+e.amount);$("modes").innerHTML=Object.entries(modes).sort((x,y)=>y[1]-x[1]).map(x=>`<div class="expense"><b>${x[0]}</b><b>${M(x[1])}</b></div>`).join("")||"<div class='muted'>No data.</div>";let top=cats.map(c=>[c,a.filter(e=>e.category==c).reduce((x,e)=>x+e.amount,0)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,4);$("chart").innerHTML=top.length?top.map(x=>`<div class="expense"><b>${x[0]}</b><b>${M(x[1])}</b></div>`).join(""):"No spending yet."}async function load(){try{let r=await fetch(C.webAppUrl+"?action=getData&month="+encodeURIComponent($("month").value),{cache:"no-store"}),d=await r.json();if(!d.ok)throw Error();s.income=+d.settings.income||0;s.overall=+d.settings.overallBudget||0;cats.forEach(c=>s.budgets[c]=+d.budgets[c]||0);s.expenses=(d.expenses||[]).map(e=>({...e,amount:+e.amount||0,ts:+e.ts||Date.now()}));save();fill();render();$("sync").textContent=" • ☁️ Connected"}catch(e){render();$("sync").textContent=" • Local mode"}}$("form").onsubmit=async e=>{e.preventDefault();let x={date:$("date").value,ts:Date.now(),amount:+$("amount").value,mode:$("mode").value,category:$("category").value,description:$("desc").value.trim()};if(!(x.amount>0))return;s.expenses.push(x);save();render();$("form").reset();$("date").value=today;$("em").textContent="Saving…";try{await fetch(C.webAppUrl,{method:"POST",mode:"no-cors",body:new URLSearchParams({action:"addExpense",...x,amount:String(x.amount),ts:String(x.ts)})});$("em").textContent="✓ Saved to Google Sheet"}catch(_){$("em").textContent="Saved locally; sync unavailable"}};$("saveB").onclick=async()=>{s.income=+$("income").value||0;s.overall=+$("overall").value||0;document.querySelectorAll(".bi").forEach(x=>s.budgets[x.dataset.c]=+x.value||0);save();render();try{await fetch(C.webAppUrl,{method:"POST",mode:"no-cors",body:new URLSearchParams({action:"saveBudget",month:$("month").value,income:s.income,overallBudget:s.overall,budgets:JSON.stringify(s.budgets)})});$("bm").textContent="✓ Budget saved to Google Sheet"}catch(_){$("bm").textContent="Saved locally; sync unavailable"}};$("month").onchange=()=>{render();load()};document.querySelectorAll(".quick button").forEach(b=>b.addEventListener("click",function(ev){
  ev.preventDefault();
  $("category").value=b.dataset.c;
  $("expense").scrollIntoView({behavior:"smooth",block:"start"});
  $("amount").focus();
}));document.querySelectorAll(".bottom button").forEach(b=>{
  b.type="button";
  b.addEventListener("click",function(ev){
    ev.preventDefault();
    document.querySelectorAll(".bottom button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    const target=document.getElementById(b.dataset.go);
    if(target) target.scrollIntoView({behavior:"smooth",block:"start"});
  });
});fill();render();load()})()
</script><script>
(function(){
 const box=document.getElementById("installBox"), btn=document.getElementById("installBtn"), msg=document.getElementById("installMsg"), diag=document.getElementById("pwaDiagText");
 let deferredPrompt=null;
 function setDiag(t){if(diag)diag.innerHTML=t;}
 window.addEventListener("beforeinstallprompt", e=>{e.preventDefault(); deferredPrompt=e; if(box)box.style.display="block"; if(msg)msg.textContent="Chrome has made the PWA install prompt available."; setDiag("🟢 <b>Install prompt available</b><br>🟢 Manifest detected<br>🟢 Service worker registered");});
 if(btn) btn.onclick=async()=>{ if(!deferredPrompt){if(msg)msg.textContent="Chrome has not exposed the PWA install prompt yet. Refresh once and check PWA Status below."; return;} deferredPrompt.prompt(); const c=await deferredPrompt.userChoice; if(msg)msg.textContent=c.outcome==="accepted"?"✓ Installation accepted.":"Installation cancelled."; deferredPrompt=null; };
 window.addEventListener("appinstalled",()=>{if(box)box.style.display="none";setDiag("🟢 <b>My Budget is installed.</b>");});
 async function check(){
   let sw="🔴 Service worker not supported", ctrl="🔴 Page not controlled", man="🔴 Manifest not readable";
   if("serviceWorker" in navigator){try{const r=await navigator.serviceWorker.register("/Monthly-Budget/sw.js?v=331",{scope:"/Monthly-Budget/",updateViaCache:"none"}); await r.update(); sw="🟢 Service worker registered"; if(navigator.serviceWorker.controller) ctrl="🟢 Page is controlled by service worker"; else ctrl="🟡 Service worker registered — refresh this page once";}catch(e){sw="🔴 Service worker error: "+(e.message||e);}}
   try{const r=await fetch("/Monthly-Budget/manifest.json?v=33",{cache:"no-store"}); const m=await r.json(); if(m.name && m.start_url && m.scope && Array.isArray(m.icons) && m.icons.length) man="🟢 Manifest valid";}catch(e){}
   setDiag(man+"<br>"+sw+"<br>"+ctrl+"<br>"+(deferredPrompt?"🟢 Install prompt available":"🟡 Waiting for Chrome install prompt"));
 }
 if(document.readyState==="loading") window.addEventListener("DOMContentLoaded",check); else check();
})();
</script>
</body></html>
